[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pymol-quickvisuals"
version = "0.1.0"
description = "Control PyMOL from Claude: plain-language commands, real error reporting, and screenshots Claude can see."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Omar Arias-Gaguancela" }]
requires-python = ">=3.10"
dependencies = ["mcp>=1.2"]
keywords = ["pymol", "mcp", "claude", "structural-biology", "molecular-visualization"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Visualization",
]

[project.scripts]
pymol-quickvisuals = "pymol_quickvisuals.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pymol_quickvisuals"]
